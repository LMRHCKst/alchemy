name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Библиотеки Qt для headless-запуска
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: Согласованность термодинамики
        run: python tools/check_thermo.py

      - name: Покрытие движков тестами
        run: python tools/coverage_report.py

      - name: Список расхождений со стресс-планом
        run: python tools/stress_run.py || true
